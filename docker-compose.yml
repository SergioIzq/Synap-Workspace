services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synap}
      POSTGRES_USER: ${POSTGRES_USER:-synap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - synap-postgres-data:/var/lib/postgresql/data
    # No `ports:` mapping: only synap-api and synap-ai (same Docker network) ever need to reach
    # Postgres. For local dev without those containers, run
    # `docker compose run --rm --service-ports postgres` or add a temporary override file
    # instead of exposing 5432 on every deployment (including the VPS).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synap} -d ${POSTGRES_DB:-synap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  synap-api:
    build:
      context: ./Synap-Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Database=${POSTGRES_DB:-synap};Username=${POSTGRES_USER:-synap};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      AiService__BaseUrl: http://synap-ai:8000
      AiService__InternalApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"

  synap-ai:
    build:
      context: ./Synap-Backend/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SYNAP_AI_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-synap}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-synap}
      SYNAP_AI_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      SYNAP_AI_GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # No `ports:` mapping: synap-ai is reached by synap-api at http://synap-ai:8000 over the
    # internal Docker network only. Its /internal/* routes are gated by INTERNAL_API_KEY as
    # defense in depth, but the real control is simply never exposing this port to the host or
    # the internet - see docs/deployment-runbook.md.

  synap-frontend:
    build:
      context: ./Synap-Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - synap-api
    ports:
      - "4200:80"

volumes:
  synap-postgres-data:
