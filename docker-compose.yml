services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synap}
      POSTGRES_USER: ${POSTGRES_USER:-synap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - synap-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synap} -d ${POSTGRES_DB:-synap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  synap-api:
    build:
      context: ./Synap-Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Database=${POSTGRES_DB:-synap};Username=${POSTGRES_USER:-synap};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"

  synap-ai:
    build:
      context: ./Synap-Backend/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SYNAP_AI_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-synap}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-synap}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  synap-frontend:
    build:
      context: ./Synap-Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - synap-api
    ports:
      - "4200:80"

volumes:
  synap-postgres-data:
